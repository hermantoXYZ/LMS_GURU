<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%" style="background:#0f172a; font-family:'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Ambient Glows -->
  <circle cx="200" cy="100" r="120" fill="#2563eb" opacity="0.15" filter="url(#glow)"/>
  <circle cx="750" cy="350" r="140" fill="#059669" opacity="0.12" filter="url(#glow)"/>
  <circle cx="500" cy="280" r="100" fill="#7c3aed" opacity="0.1" filter="url(#glow)"/>

  <!-- Title Banner -->
  <g transform="translate(40, 35)">
    <rect width="880" height="60" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <!-- Icon Graduation Cap -->
    <rect x="20" y="12" width="36" height="36" rx="10" fill="url(#grad-blue)"/>
    <path d="M38 20 L27 25 L38 30 L49 25 Z M31 28.5 V33 C31 35.5 45 35.5 45 33 V28.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="68" y="31" fill="#f8fafc" font-size="16" font-weight="800" letter-spacing="-0.3">ARSITEKTUR &amp; TEKNOLOGI STACK — EDUSMART LMS</text>
    <text x="68" y="47" fill="#94a3b8" font-size="12" font-weight="500">Sistem Manajemen Pembelajaran Sekolah Berbasis Web &amp; Google Workspace (100% Serverless)</text>
    <rect x="740" y="16" width="120" height="28" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="754" cy="30" r="4" fill="#38bdf8"/>
    <text x="765" y="34" fill="#38bdf8" font-size="11" font-weight="700">GRATIS &amp; PRAKTIS</text>
  </g>

  <!-- 1. LAYER FRONTEND (KIRI) -->
  <g transform="translate(40, 115)">
    <!-- Container Card -->
    <rect width="265" height="405" rx="18" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.8"/>
    <rect x="0" y="0" width="265" height="42" rx="18" fill="url(#grad-blue)" opacity="0.2"/>
    <rect x="16" y="12" width="20" height="20" rx="6" fill="#3b82f6"/>
    <text x="26" y="26" fill="#ffffff" font-size="11" font-weight="900" text-anchor="middle">1</text>
    <text x="44" y="26" fill="#ffffff" font-size="13" font-weight="700">FRONTEND (CLIENT)</text>

    <!-- Sub-box Peran Pengguna -->
    <rect x="14" y="52" width="237" height="110" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="24" y="70" fill="#93c5fd" font-size="11" font-weight="700">PENGGUNA &amp; PERANGKAT:</text>
    
    <!-- Role Siswa -->
    <circle cx="32" cy="90" r="5" fill="#60a5fa"/>
    <text x="44" y="93" fill="#e2e8f0" font-size="11" font-weight="600">Siswa (HP / Tablet / Laptop)</text>
    <text x="44" y="105" fill="#64748b" font-size="9">Nonton Video &amp; Ujian CBT Online</text>

    <!-- Role Guru -->
    <circle cx="32" cy="122" r="5" fill="#34d399"/>
    <text x="44" y="125" fill="#e2e8f0" font-size="11" font-weight="600">Guru (Laptop / Komputer)</text>
    <text x="44" y="137" fill="#64748b" font-size="9">Upload Materi, Buat Soal &amp; Koreksi</text>

    <!-- Role Admin -->
    <circle cx="32" cy="154" r="5" fill="#c084fc"/>
    <text x="44" y="157" fill="#e2e8f0" font-size="11" font-weight="600">Admin (PC Sekolah)</text>
    
    <!-- Sub-box Stack Frontend -->
    <rect x="14" y="174" width="237" height="215" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="24" y="195" fill="#38bdf8" font-size="11" font-weight="700">TEKNOLOGI DIGUNAKAN:</text>

    <!-- Item HTML5 -->
    <rect x="24" y="208" width="217" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="34" y="224" fill="#f97316" font-size="11" font-weight="800">HTML5 Semantik</text>
    <text x="34" y="235" fill="#94a3b8" font-size="9">Single Page Application (SPA)</text>

    <!-- Item Tailwind CSS -->
    <rect x="24" y="248" width="217" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="34" y="264" fill="#38bdf8" font-size="11" font-weight="800">Tailwind CSS (CDN)</text>
    <text x="34" y="275" fill="#94a3b8" font-size="9">Responsif di HP, Tablet, &amp; Monitor</text>

    <!-- Item JavaScript -->
    <rect x="24" y="288" width="217" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="34" y="304" fill="#facc15" font-size="11" font-weight="800">Vanilla JavaScript (ES6+)</text>
    <text x="34" y="315" fill="#94a3b8" font-size="9">State, Fetch API, LocalStorage Session</text>

    <!-- Item Lucide Icons -->
    <rect x="24" y="328" width="217" height="48" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="34" y="344" fill="#e2e8f0" font-size="11" font-weight="800">Lucide Icons &amp; Google Fonts</text>
    <text x="34" y="356" fill="#94a3b8" font-size="9">Plus Jakarta Sans &amp; JetBrains Mono</text>
    <text x="34" y="367" fill="#64748b" font-size="8">Ikon visual modern &amp; antarmuka ramah</text>
  </g>

  <!-- PANAH ALIRAN 1 -> 2 -->
  <g transform="translate(315, 290)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4,4"/>
    <polygon points="30,-5 40,0 30,5" fill="#38bdf8"/>
    <text x="20" y="-12" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">HTTPS</text>
    <text x="20" y="20" fill="#94a3b8" font-size="8" text-anchor="middle">JSON POST</text>
  </g>

  <!-- 2. LAYER BACKEND & KEAMANAN (TENGAH) -->
  <g transform="translate(365, 115)">
    <!-- Container Card -->
    <rect width="250" height="405" rx="18" fill="#1e293b" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.8"/>
    <rect x="0" y="0" width="250" height="42" rx="18" fill="url(#grad-emerald)" opacity="0.2"/>
    <rect x="16" y="12" width="20" height="20" rx="6" fill="#10b981"/>
    <text x="26" y="26" fill="#ffffff" font-size="11" font-weight="900" text-anchor="middle">2</text>
    <text x="44" y="26" fill="#ffffff" font-size="13" font-weight="700">BACKEND ENGINE</text>

    <!-- Sub-box Apps Script -->
    <rect x="14" y="52" width="222" height="120" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="24" y="70" fill="#34d399" font-size="11" font-weight="700">GOOGLE APPS SCRIPT (GAS):</text>
    <rect x="24" y="80" width="202" height="82" rx="8" fill="#1e293b"/>
    <text x="32" y="96" fill="#10b981" font-size="11" font-weight="800">File: Code.gs (Web App)</text>
    <text x="32" y="110" fill="#cbd5e1" font-size="9.5">• doGet() &amp; doPost() Dispatcher</text>
    <text x="32" y="124" fill="#cbd5e1" font-size="9.5">• LockService (Anti-Crash Ujian)</text>
    <text x="32" y="138" fill="#cbd5e1" font-size="9.5">• Auto Correct CBT PG &amp; Skoring</text>
    <text x="32" y="152" fill="#cbd5e1" font-size="9.5">• Validasi Token Sesi 24 Jam</text>

    <!-- Sub-box Router API -->
    <rect x="14" y="184" width="222" height="205" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="24" y="204" fill="#a7f3d0" font-size="11" font-weight="700">LOGIKA &amp; ROUTE UTAMA:</text>

    <rect x="24" y="214" width="202" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="32" y="232" fill="#f8fafc" font-size="10" font-weight="700">action: login &amp; auth</text>

    <rect x="24" y="248" width="202" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="32" y="266" fill="#f8fafc" font-size="10" font-weight="700">action: getAllData (Sync DB)</text>

    <rect x="24" y="282" width="202" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="32" y="300" fill="#f8fafc" font-size="10" font-weight="700">action: createMateri &amp; Soal</text>

    <rect x="24" y="316" width="202" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="32" y="334" fill="#f8fafc" font-size="10" font-weight="700">action: submitJawaban (CBT)</text>

    <rect x="24" y="350" width="202" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="32" y="368" fill="#f8fafc" font-size="10" font-weight="700">action: koreksiEsai &amp; Users</text>
  </g>

  <!-- PANAH ALIRAN 2 -> 3 -->
  <g transform="translate(625, 290)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#34d399" stroke-width="2.5" stroke-dasharray="4,4"/>
    <polygon points="30,-5 40,0 30,5" fill="#34d399"/>
    <text x="20" y="-12" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">Apps Script</text>
    <text x="20" y="20" fill="#94a3b8" font-size="8" text-anchor="middle">API Spreadsheet</text>
  </g>

  <!-- 3. LAYER DATABASE & MEDIA (KANAN) -->
  <g transform="translate(675, 115)">
    <!-- Container Card -->
    <rect width="245" height="405" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.8"/>
    <rect x="0" y="0" width="245" height="42" rx="18" fill="url(#grad-amber)" opacity="0.2"/>
    <rect x="16" y="12" width="20" height="20" rx="6" fill="#f59e0b"/>
    <text x="26" y="26" fill="#ffffff" font-size="11" font-weight="900" text-anchor="middle">3</text>
    <text x="44" y="26" fill="#ffffff" font-size="13" font-weight="700">DATABASE &amp; STORAGE</text>

    <!-- Sub-box Google Sheets Database -->
    <rect x="14" y="52" width="217" height="235" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="24" y="70" fill="#fbbf24" font-size="11" font-weight="700">GOOGLE SPREADSHEET:</text>
    <text x="24" y="82" fill="#94a3b8" font-size="9">6 Tabel Relasional Sekolah</text>

    <!-- 6 Sheet Badges -->
    <g transform="translate(24, 92)">
      <rect x="0" y="0" width="95" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="8" y="14" fill="#38bdf8" font-size="9.5" font-weight="700">1. users</text>
      <text x="8" y="24" fill="#64748b" font-size="8">Akun sekolah</text>

      <rect x="102" y="0" width="95" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="110" y="14" fill="#34d399" font-size="9.5" font-weight="700">2. master</text>
      <text x="110" y="24" fill="#64748b" font-size="8">Kelas &amp; Jurusan</text>

      <rect x="0" y="36" width="95" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="8" y="50" fill="#c084fc" font-size="9.5" font-weight="700">3. materi</text>
      <text x="8" y="60" fill="#64748b" font-size="8">Modul Guru</text>

      <rect x="102" y="36" width="95" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="110" y="50" fill="#fbbf24" font-size="9.5" font-weight="700">4. soal</text>
      <text x="110" y="60" fill="#64748b" font-size="8">Bank Soal CBT</text>

      <rect x="0" y="72" width="95" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="8" y="86" fill="#f43f5e" font-size="9.5" font-weight="700">5. jawaban</text>
      <text x="8" y="96" fill="#64748b" font-size="8">Rekap Nilai Siswa</text>

      <rect x="102" y="72" width="95" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="110" y="86" fill="#a78bfa" font-size="9.5" font-weight="700">6. sessions</text>
      <text x="110" y="96" fill="#64748b" font-size="8">Token Login</text>
    </g>

    <text x="24" y="222" fill="#cbd5e1" font-size="9.5">• 100% Milik Akun Google Sekolah</text>
    <text x="24" y="238" fill="#cbd5e1" font-size="9.5">• Bisa langsung ekspor ke Excel / PDF</text>
    <text x="24" y="254" fill="#cbd5e1" font-size="9.5">• Auto-backup di Google Drive</text>
    <text x="24" y="270" fill="#10b981" font-size="9.5" font-weight="700">✓ Tanpa Biaya Database Bulanan</text>

    <!-- Sub-box Media Hosting YouTube -->
    <rect x="14" y="297" width="217" height="92" rx="12" fill="#0f172a" stroke="#f43f5e" stroke-width="1"/>
    <text x="24" y="316" fill="#fb7185" font-size="11" font-weight="700">HOSTING MEDIA VIDEO:</text>
    <rect x="24" y="326" width="197" height="52" rx="8" fill="#1e293b"/>
    <rect x="32" y="336" width="28" height="20" rx="6" fill="#ef4444"/>
    <polygon points="43,342 43,350 49,346" fill="#ffffff"/>
    <text x="68" y="344" fill="#f8fafc" font-size="11" font-weight="800">YouTube Embed API</text>
    <text x="68" y="356" fill="#94a3b8" font-size="9">Streaming lancar &amp; hemat bandwidth server</text>
    <text x="68" y="367" fill="#64748b" font-size="8.5">Guru cukup input link video materi</text>
  </g>

  <!-- Footer Banner Mini -->
  <g transform="translate(40, 528)">
    <text x="0" y="16" fill="#64748b" font-size="10" font-weight="500">EduSmart LMS — Panduan Implementasi Digital Sekolah • 100% Bebas Server • Google Workspace Ready</text>
    <text x="880" y="16" fill="#94a3b8" font-size="10" font-weight="600" text-anchor="end">Versi 2.0 (Arsitektur Terpisah: index.html, styles.css, app.js, Code.gs)</text>
  </g>
</svg>
